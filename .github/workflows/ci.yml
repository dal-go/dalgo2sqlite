name: Go CI

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+\.[0-9]+\.[0-9]+' # Push events to matching v*, i.e. v20.15.10
  pull_request:
    branches:
      - '**'

jobs:

  strongo_workflow:
    permissions:
      contents: write
    uses: strongo/cicd/.github/workflows/workflow.yml@b9bc69e5e3c3123956fc82a41d393cdd0cb23cbf # v1.25.5

    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    with:
      # Uses modernc.org/sqlite (pure Go) — no C toolchain needed.
      cgo_enabled: false
      code_coverage: true
      min_test_coverage_percent: 100
